[package]
name = "core-nuclear"
version = "1.0.0"
description = "CORE: Nuclear power plant operations simulator"
authors = ["CORE: Nuclear"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "core_nuclear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
